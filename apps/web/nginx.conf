limit_req_zone $binary_remote_addr zone=jsa_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=jsa_register:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=jsa_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;
    limit_conn jsa_per_ip 12;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /v1/auth/login {
        limit_req zone=jsa_login burst=5 nodelay;
        proxy_pass http://local-service:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/auth/register {
        limit_req zone=jsa_register burst=1 nodelay;
        proxy_pass http://local-service:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://local-service:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        # Extension collection can span multiple keywords and lazy-loaded pages.
        proxy_read_timeout 600s;
    }

    location = /openapi.json {
        proxy_pass http://local-service:8765/openapi.json;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://local-service:8765;
        proxy_set_header Host $host;
    }

    location = /redoc {
        proxy_pass http://local-service:8765;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
