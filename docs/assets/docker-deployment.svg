<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Docker Compose 三容器部署架构</title>
  <desc id="desc">浏览器和本机自动化组件访问由 Docker Compose 管理的 web、local-service 与 embedding 三个容器。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#64748b}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#475569}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="1200" rx="24" fill="url(#bg)"/>
  <text x="55" y="58" class="title">Docker Compose 三容器部署</text><text x="55" y="86" class="subtitle">一个 Compose 文件统一拉取、联网、健康检查和持久化三个 GHCR 镜像</text>

  <g filter="url(#shadow)"><rect x="55" y="150" width="220" height="155" rx="18" fill="#fff"/><rect x="55" y="150" width="220" height="45" rx="18" fill="#fef3c7"/><rect x="55" y="177" width="220" height="18" fill="#fef3c7"/><text x="78" y="180" class="h">本机组件</text><text x="78" y="225" class="t">浏览器管理后台</text><text x="78" y="251" class="t">BOSS Skill / WebBridge</text><text x="78" y="277" class="t">Chrome 扩展</text></g>

  <rect x="340" y="115" width="805" height="395" rx="28" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7"/><text x="370" y="150" class="h">Docker Compose 网络</text>
  <g filter="url(#shadow)"><rect x="385" y="190" width="205" height="170" rx="18" fill="#fff" stroke="#60a5fa" stroke-width="2"/><rect x="385" y="190" width="205" height="48" rx="18" fill="#dbeafe"/><rect x="385" y="220" width="205" height="18" fill="#dbeafe"/><text x="410" y="222" class="h">web</text><text x="410" y="268" class="t">Nginx + Vue</text><text x="410" y="296" class="mono">127.0.0.1:8765</text><text x="410" y="326" class="t">/v1 反向代理</text></g>
  <g filter="url(#shadow)"><rect x="665" y="190" width="205" height="170" rx="18" fill="#fff" stroke="#34d399" stroke-width="2"/><rect x="665" y="190" width="205" height="48" rx="18" fill="#d1fae5"/><rect x="665" y="220" width="205" height="18" fill="#d1fae5"/><text x="690" y="222" class="h">local-service</text><text x="690" y="268" class="t">FastAPI + SQLite</text><text x="690" y="296" class="mono">内部端口 8765</text><text x="690" y="326" class="t">业务与数据事实源</text></g>
  <g filter="url(#shadow)"><rect x="945" y="190" width="160" height="170" rx="18" fill="#fff" stroke="#a78bfa" stroke-width="2"/><rect x="945" y="190" width="160" height="48" rx="18" fill="#ede9fe"/><rect x="945" y="220" width="160" height="18" fill="#ede9fe"/><text x="968" y="222" class="h">embedding</text><text x="968" y="268" class="t">FastEmbed</text><text x="968" y="296" class="mono">8766</text><text x="968" y="326" class="t">语义向量服务</text></g>

  <path d="M275 228 H375" class="line"/><text x="284" y="211" class="mono">HTTP :8765</text><path d="M590 275 H655" class="line"/><text x="600" y="257" class="mono">/v1</text><path d="M870 275 H935" class="line"/><text x="878" y="257" class="mono">HTTP</text>

  <g filter="url(#shadow)"><rect x="505" y="410" width="210" height="62" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="530" y="438" class="h">./data</text><text x="530" y="460" class="t">SQLite 与简历文件</text></g>
  <g filter="url(#shadow)"><rect x="805" y="410" width="245" height="62" rx="16" fill="#faf5ff" stroke="#d8b4fe"/><text x="830" y="438" class="h">embedding-models</text><text x="830" y="460" class="t">模型持久化 Volume</text></g>
  <path d="M765 360 V395 Q765 410 715 425" class="line"/><path d="M1025 360 V400" class="line"/>

  <text x="55" y="557" class="h">边界说明</text><text x="55" y="586" class="subtitle">Docker 内：管理后台、本地 API、Embedding　　｜　　Docker 外：BOSS 登录浏览器、Skill、Kimi WebBridge、Chrome 扩展</text>

  <g filter="url(#shadow)">
    <rect x="55" y="660" width="1090" height="390" rx="22" fill="#fff"/>
    <text x="90" y="712" class="h">运行与持久化</text>
    <rect x="90" y="755" width="305" height="220" rx="18" fill="#eff6ff"/>
    <text x="120" y="800" class="h">一次启动</text>
    <text x="120" y="842" class="mono">docker compose pull</text><text x="120" y="878" class="mono">docker compose up -d</text><text x="120" y="924" class="t">Compose 自动处理网络、依赖</text><text x="120" y="950" class="t">顺序与健康检查。</text>
    <rect x="447" y="755" width="305" height="220" rx="18" fill="#f0fdf4"/>
    <text x="477" y="800" class="h">业务数据</text>
    <text x="477" y="842" class="mono">./data:/data</text><text x="477" y="884" class="t">SQLite、简历与配置保存在</text><text x="477" y="910" class="t">Compose 文件同级目录，更新</text><text x="477" y="936" class="t">镜像不会删除。</text>
    <rect x="804" y="755" width="305" height="220" rx="18" fill="#faf5ff"/>
    <text x="834" y="800" class="h">模型缓存</text>
    <text x="834" y="842" class="mono">embedding-models</text><text x="834" y="884" class="t">首次启动下载向量模型，之后</text><text x="834" y="910" class="t">复用命名 Volume；无需重复</text><text x="834" y="936" class="t">下载。</text>
  </g>
  <text x="600" y="1125" text-anchor="middle" class="subtitle">三个 GHCR 镜像由一个 docker-compose.release.yml 统一编排，不需要分别执行 docker run。</text>
</svg>
