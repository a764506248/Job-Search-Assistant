<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Job Search Assistant 整体工作流</title>
  <desc id="desc">从本地资料、BOSS 页面采集、职位分析、原子决策到安全投递和结果回写的完整流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#64748b}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#475569}.white{fill:#fff}.tag{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="1200" rx="24" fill="url(#bg)"/>
  <text x="60" y="60" class="title">Job Search Assistant 整体工作流</text>
  <text x="60" y="88" class="subtitle">本地资料与规则驱动决策，浏览器层只负责读取、点击和经过验证的发送</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="230" height="190" rx="18" fill="#fff"/>
    <rect x="55" y="145" width="230" height="48" rx="18" fill="#dbeafe"/><rect x="55" y="175" width="230" height="18" fill="#dbeafe"/>
    <text x="78" y="177" class="h">① 准备本地资料</text>
    <text x="78" y="222" class="t">• 个人档案与项目经历</text><text x="78" y="250" class="t">• 简历与默认首页图片</text><text x="78" y="278" class="t">• 匹配、薪资与风险规则</text><text x="78" y="306" class="t">• 搜索关键词与每日目标</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="355" y="145" width="230" height="190" rx="18" fill="#fff"/>
    <rect x="355" y="145" width="230" height="48" rx="18" fill="#ede9fe"/><rect x="355" y="175" width="230" height="18" fill="#ede9fe"/>
    <text x="378" y="177" class="h">② 搜索与采集</text>
    <text x="378" y="222" class="t">• Skill 编排关键词循环</text><text x="378" y="250" class="t">• WebBridge 控制 BOSS 页面</text><text x="378" y="278" class="t">• 懒加载岗位卡片</text><text x="378" y="306" class="t">• 原地点击并读取完整 JD</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="655" y="145" width="230" height="190" rx="18" fill="#fff"/>
    <rect x="655" y="145" width="230" height="48" rx="18" fill="#dcfce7"/><rect x="655" y="175" width="230" height="18" fill="#dcfce7"/>
    <text x="678" y="177" class="h">③ 原子分析决策</text>
    <text x="678" y="222" class="t">• 职位快照幂等入库</text><text x="678" y="250" class="t">• 本地资料匹配真实经历证据</text><text x="678" y="278" class="t">• 规则、适合度与可信度</text><text x="678" y="306" class="t">• APPROVE / REJECT 计划</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="955" y="145" width="190" height="190" rx="18" fill="#fff"/>
    <rect x="955" y="145" width="190" height="48" rx="18" fill="#ffedd5"/><rect x="955" y="175" width="190" height="18" fill="#ffedd5"/>
    <text x="978" y="177" class="h">④ 安全投递</text>
    <text x="978" y="222" class="t">• 校验岗位与公司</text><text x="978" y="250" class="t">• 去重后发送问候语</text><text x="978" y="278" class="t">• 按策略发送简历图片</text><text x="978" y="306" class="t">• 验证气泡实际送达</text>
  </g>

  <path d="M285 240 H345" class="line"/><path d="M585 240 H645" class="line"/><path d="M885 240 H945" class="line"/>

  <g filter="url(#shadow)">
    <rect x="185" y="420" width="830" height="175" rx="22" fill="#fff"/>
    <rect x="185" y="420" width="830" height="55" rx="22" fill="url(#primary)"/><rect x="185" y="452" width="830" height="23" fill="url(#primary)"/>
    <text x="220" y="455" class="h white">⑤ 结果回写、断点续传与循环终止</text>
    <text x="225" y="515" class="t">成功、失败和跳过结果写入本地 SQLite；服务不可用时进入本地 outbox，恢复后重试同步。</text>
    <text x="225" y="548" class="t">达到每日目标、触发上限或关键词穷尽后强制生成 HTML 汇总；中断后依据进度文件继续。</text>
    <rect x="785" y="505" width="175" height="44" rx="22" fill="#eff6ff"/><text x="815" y="533" class="tag" fill="#2563eb">本地数据闭环</text>
  </g>
  <path d="M1050 335 V382 Q1050 405 1025 405 H600 V415" class="line"/>
  <path d="M185 540 H135 Q110 540 110 515 V370 Q110 345 135 345 H455 V338" class="line" stroke-dasharray="8 7"/>
  <text x="120" y="390" class="tag" fill="#64748b">未达目标 → 下一批 / 下一关键词</text>

  <g transform="translate(55 635)"><circle cx="8" cy="-5" r="7" fill="#2563eb"/><text x="25" y="0" class="subtitle">业务事实源：本地 API + SQLite</text></g>
  <g transform="translate(385 635)"><circle cx="8" cy="-5" r="7" fill="#7c3aed"/><text x="25" y="0" class="subtitle">浏览器 I/O：Kimi WebBridge</text></g>
  <g transform="translate(700 635)"><circle cx="8" cy="-5" r="7" fill="#f97316"/><text x="25" y="0" class="subtitle">图片发送：项目 Chrome 扩展</text></g>

  <g filter="url(#shadow)">
    <rect x="55" y="735" width="1090" height="370" rx="22" fill="#fff"/>
    <text x="90" y="785" class="h">安全边界与失败处理</text>
    <rect x="90" y="825" width="305" height="205" rx="18" fill="#eff6ff"/>
    <text x="120" y="868" class="h">浏览器操作</text>
    <text x="120" y="910" class="t">• 不直接进入职位详情 URL</text><text x="120" y="942" class="t">• 发送前后校验岗位与公司</text><text x="120" y="974" class="t">• 未验证消息气泡则不记成功</text>
    <rect x="447" y="825" width="305" height="205" rx="18" fill="#f5f3ff"/>
    <text x="477" y="868" class="h">业务决策</text>
    <text x="477" y="910" class="t">• 完整 JD 才能进入原子分析</text><text x="477" y="942" class="t">• 数据库规则决定批准或拒绝</text><text x="477" y="974" class="t">• 可信度不足回退默认材料</text>
    <rect x="804" y="825" width="305" height="205" rx="18" fill="#fff7ed"/>
    <text x="834" y="868" class="h">流程恢复</text>
    <text x="834" y="910" class="t">• 懒加载恢复缓存岗位卡片</text><text x="834" y="942" class="t">• outbox 暂存未同步记录</text><text x="834" y="974" class="t">• 任意终止路径生成汇总</text>
  </g>
  <text x="600" y="1160" text-anchor="middle" class="subtitle">本图描述自动投递主链路；管理后台负责维护资料、规则、模型与历史记录。</text>
</svg>
