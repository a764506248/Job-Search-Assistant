services:
  web:
    image: ghcr.io/a764506248/job-search-assistant-web:${JSA_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8765:80"
    depends_on:
      local-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  local-service:
    image: ghcr.io/a764506248/job-search-assistant-local-service:${JSA_IMAGE_TAG:-latest}
    expose:
      - "8765"
    environment:
      JSA_HOST: 0.0.0.0
      JSA_PORT: 8765
      JSA_DATA_DIR: /data
      JSA_EMBEDDING_URL: http://embedding:8766
      JSA_EMBEDDING_MODEL: jinaai/jina-embeddings-v2-base-zh
    volumes:
      - ./data:/data
    depends_on:
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  embedding:
    image: ghcr.io/a764506248/job-search-assistant-embedding:${JSA_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      EMBEDDING_MODEL: jinaai/jina-embeddings-v2-base-zh
      FASTEMBED_CACHE_DIR: /models/fastembed
      HF_HOME: /models/fastembed/huggingface
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - embedding-models:/models/fastembed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  embedding-models:
