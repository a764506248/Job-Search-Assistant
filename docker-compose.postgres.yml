# PostgreSQL 迁移阶段基础设施。
# 当前业务容器仍使用 SQLite；完成 Repository 迁移后再将 JSA_DATABASE_URL 接入 local-service。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_search_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-jsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ./deploy-data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-admin:
    image: postgres:16-alpine
    profiles: ["admin"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-jsa}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-job_search_assistant}
    entrypoint: ["sh", "-c"]
    command: ["tail -f /dev/null"]
