services:
  embedding:
    build:
      context: ./services/embedding
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      EMBEDDING_MODEL: jinaai/jina-embeddings-v2-base-zh
      HF_HOME: /models/huggingface
    volumes:
      - embedding-models:/models/huggingface
    restart: unless-stopped

volumes:
  embedding-models:
