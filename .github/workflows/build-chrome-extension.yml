name: Build Chrome Extension

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - '.github/workflows/build-chrome-extension.yml'
      - 'apps/extension/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build job-search-assistant-chrome-mv3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check extension
        run: npm run check:extension

      - name: Test extension
        run: npm run test:extension

      - name: Build Chrome MV3 extension
        run: npm run build:extension

      - name: Package extension
        run: |
          mkdir -p artifacts
          cd apps/extension/.output/chrome-mv3
          zip -r ../../../../artifacts/job-search-assistant-chrome-mv3.zip .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-search-assistant-chrome-mv3
          path: artifacts/job-search-assistant-chrome-mv3.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Chrome extension release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged extension
        uses: actions/download-artifact@v4
        with:
          name: job-search-assistant-chrome-mv3
          path: artifacts

      - name: Publish extension to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              artifacts/job-search-assistant-chrome-mv3.zip \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              artifacts/job-search-assistant-chrome-mv3.zip \
              --verify-tag \
              --generate-notes \
              --title "Job Search Assistant $GITHUB_REF_NAME"
          fi
