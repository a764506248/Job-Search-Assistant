name: Build Chrome Extension

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build job-search-assistant-chrome-mv3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check extension
        run: npm run check:extension

      - name: Test extension
        run: npm run test:extension

      - name: Build Chrome MV3 extension
        run: npm run build:extension

      - name: Package extension
        run: |
          mkdir -p artifacts
          cd apps/extension/.output/chrome-mv3
          zip -r ../../../../artifacts/job-search-assistant-chrome-mv3.zip .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-search-assistant-chrome-mv3
          path: artifacts/job-search-assistant-chrome-mv3.zip
          if-no-files-found: error
          retention-days: 30
