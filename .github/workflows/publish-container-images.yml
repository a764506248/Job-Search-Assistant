name: Publish Container Images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/publish-container-images.yml'
      - 'apps/web/**'
      - 'apps/local-service/**'
      - 'services/embedding/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docker-compose.release.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image: ghcr.io/a764506248/job-search-assistant-web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: local-service
            image: ghcr.io/a764506248/job-search-assistant-local-service
            context: apps/local-service
            dockerfile: apps/local-service/Dockerfile
          - name: embedding
            image: ghcr.io/a764506248/job-search-assistant-embedding
            context: services/embedding
            dockerfile: services/embedding/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Job Search Assistant ${{ matrix.name }}
            org.opencontainers.image.description=Local-first BOSS job search assistant component
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 构建完成后自动部署到腾讯云轻量服务器。
  # 只在打 tag（v*）时触发，避免 main 分支的日常提交把未验证的镜像推上线。
  # 需要的仓库 Secrets：
  #   SSH_HOST  - 服务器 IP
  #   SSH_KEY   - 部署专用私钥（对应服务器 ~/.ssh/authorized_keys 里的公钥）
  deploy:
    name: Deploy to server
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          # local-service 镜像 381MB，实测拉取约 6 分钟，留足余量
          command_timeout: 20m
          script: |
            set -e
            cd ~/Job-Search-Assistant
            export JSA_IMAGE_TAG="${{ github.ref_name }}"
            echo "=== 部署版本: $JSA_IMAGE_TAG ==="
            docker compose -f docker-compose.server.yml pull
            docker compose -f docker-compose.server.yml up -d
            sleep 15
            echo "=== 容器状态 ==="
            docker compose -f docker-compose.server.yml ps
            echo "=== 健康检查 ==="
            curl -sf http://127.0.0.1/v1/health && echo " ← 通过"
            curl -sf http://127.0.0.1/healthz && echo " ← nginx 通过"
