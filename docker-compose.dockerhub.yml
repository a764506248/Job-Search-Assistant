services:
  web:
    image: jinxinss/job-search-assistant-web:${JSA_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8765:80"
    depends_on:
      local-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  local-service:
    image: jinxinss/job-search-assistant-local-service:${JSA_IMAGE_TAG:-latest}
    expose:
      - "8765"
    environment:
      JSA_HOST: 0.0.0.0
      JSA_PORT: 8765
      JSA_DATA_DIR: /data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  automation-runner:
    image: jinxinss/job-search-assistant-local-service:${JSA_IMAGE_TAG:-latest}
    command:
      - job-search-assistant-runner
      - --base-url
      - http://local-service:8765
    depends_on:
      local-service:
        condition: service_healthy
    restart: unless-stopped
